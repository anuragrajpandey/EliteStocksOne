name: Build EliteStocks One Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "What do you want to build?"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - aab

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.38.9

jobs:
  android:
    name: Build Android ${{ inputs.build_type }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Create release keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/elitestocks-one-release.jks" \
            -storetype JKS \
            -alias elitestocks-one \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass githubactions \
            -keypass githubactions \
            -dname "CN=EliteStocks One, OU=Build, O=EliteStocks One, C=IN"

      - name: Configure Android signing
        shell: bash
        run: |
          cat > android/key.properties <<EOF
          storePassword=githubactions
          keyPassword=githubactions
          keyAlias=elitestocks-one
          storeFile=$RUNNER_TEMP/elitestocks-one-release.jks
          EOF

      - name: Build APK
        if: inputs.build_type == 'apk'
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release \
              --build-number=${{ github.run_number }} \
              --dart-define=APP_BUILD=${{ github.run_number }}; then
              exit 0
            fi
            echo "APK build attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Build Android App Bundle
        if: inputs.build_type == 'aab'
        run: flutter build app"bundle" --release --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Verify APK
        if: inputs.build_type == 'apk'
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"

          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"

          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Upload APK
        if: inputs.build_type == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: EliteStocks-One-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        if: inputs.build_type == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: EliteStocks-One-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
